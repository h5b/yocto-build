name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * */2'

permissions:
  contents: read
  pull-requests: read

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - x86_64
    container:
      image: ghcr.io/jhnc-oss/yocto-image/yocto:42
      options: --user root
    name: "Build (${{ matrix.arch }})"
    steps:
      - uses: actions/checkout@main
      - name: Synchronize Repositories
        run: |
          PATH="${HOME}/.local/bin:${PATH}"
          repo init -u https://github.com/jhnc-oss/yocto-manifests.git -b main
          repo sync
        shell: sudo -u yocto bash --noprofile --norc -eo pipefail {0}
        working-directory: /opt/yocto
      - name: Build
        run: |
          export YOCTO_TARGET_ARCH=${{ matrix.arch }}
          export BB_ENV_PASSTHROUGH_ADDITIONS=YOCTO_TARGET_ARCH
          export TEMPLATECONF=/opt/yocto/protos/meta-protos/conf/templates/default
          echo 'INHERIT += "cve-check"' >> /opt/yocto/protos/meta-protos/conf/templates/default/local.conf.sample
          source poky/oe-init-build-env
          bitbake openssl --runall=fetch
        shell: sudo -u yocto bash --noprofile --norc -eo pipefail {0}
        working-directory: /opt/yocto

      - name: Generate nvdcve label
        id: date
        run: echo "today=$(date -u +'%Y-%m-%d-%H-00Z')" >> "$GITHUB_OUTPUT"

      - name: Upload CVE DB artifact
        uses: actions/upload-artifact@v6
        with:
          name: nvdcve-${{ steps.date.outputs.today }}
          path: /opt/yocto/download/CVE_CHECK/nvdcve_2-2.db
          retention-days: 7
